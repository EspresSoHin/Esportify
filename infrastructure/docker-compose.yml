name: esportify

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-esportify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esportify}
      POSTGRES_DB: esportify
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Exécutés uniquement au premier démarrage (volume vide)
      - ../Database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgres/02-search-path.sql:/docker-entrypoint-initdb.d/02-search-path.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d esportify"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../Backend
      dockerfile: ../infrastructure/backend/Dockerfile
    restart: unless-stopped
    environment:
      user: ${POSTGRES_USER:-esportify}
      password: ${POSTGRES_PASSWORD:-esportify}
      host: postgres
      port: "5432"
      dbname: esportify
      DB_SSLMODE: disable
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: EsportifyChat
      SECRET_KEY: ${SECRET_KEY:?Definis SECRET_KEY dans infrastructure/.env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../Frontend:/usr/share/nginx/html:ro
    # Port 5500 : déjà autorisé dans le CORS de Backend/main.py
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
